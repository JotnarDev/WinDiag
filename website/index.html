<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WinDiag — Hardware diagnostics for Windows</title>
    <meta
      name="description"
      content="Free Windows app for any laptop or desktop: test the display, keys, battery, disk and ports, bring drivers and BIOS up to date, and get the PC ready to hand over."
    />
    <meta name="theme-color" content="#141619" />
    <meta property="og:title" content="WinDiag — Hardware diagnostics for Windows" />
    <meta
      property="og:description"
      content="Test every part of any Windows laptop or desktop, bring drivers and BIOS up to date, and hand it over ready. Free and open source."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WinDiag" />
    <meta property="og:url" content="https://jotnardev.github.io/WinDiag/" />
    <!-- Link previews need an absolute address for the image -->
    <meta property="og:image" content="https://jotnardev.github.io/WinDiag/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The WinDiag logo, a cyan keycap with a W, and the line: Test it. Fix it. Hand it over." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://jotnardev.github.io/WinDiag/" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <script>
      // Apply the saved theme before the first paint, so the page never flashes
      ;(function () {
        var pref = 'dark'
        try {
          pref = localStorage.getItem('windiag-site-theme') || 'dark'
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font: 16px system-ui">
        WinDiag is a free hardware diagnostics app for Windows.
        <a href="https://github.com/JotnarDev/WinDiag/releases/latest">Download it from GitHub</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
