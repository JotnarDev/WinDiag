name: Release

# Builds the portable .exe launchers, packages a portable ZIP, and compiles the
# Inno Setup installer (Setup.exe) - then publishes all of it as GitHub Release
# assets. This is what makes "download and run" possible without anyone having to
# compile anything themselves. Runs on windows-latest since it needs csc.exe
# (bundled with .NET Framework on Windows) and Inno Setup.
#
# Trigger a release by pushing a tag: git tag v3.0.0 && git push origin v3.0.0
# Or run it manually from the Actions tab (workflow_dispatch) to sanity-check the
# build without publishing a tagged release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate app icon (Runa-M.ico)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File app/Crear-Icono.ps1

      - name: Compile Diagnostico-Hardware.exe and InstaladorUSB.exe
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          if (-not (Test-Path $csc)) { throw "csc.exe not found on this runner." }

          # Built as PowerShell arrays + splatting (@array), not backtick line
          # continuations - a backtick continuation here previously lost the
          # "app/" prefix off the last argument (Launcher.cs), which made csc.exe
          # look for the file at the repo root instead of inside app/, and broke
          # the very first release build. Arrays don't have that failure mode.
          $launcherArgs = @(
            "/nologo", "/target:winexe", "/platform:anycpu",
            "/out:app/Diagnostico-Hardware.exe",
            "/win32manifest:app/app.manifest",
            "/win32icon:app/Runa-M.ico",
            "/reference:System.dll", "/reference:System.Windows.Forms.dll",
            "app/Launcher.cs"
          )
          & $csc @launcherArgs
          if ($LASTEXITCODE -ne 0) { throw "Compiling Diagnostico-Hardware.exe failed." }

          $usbArgs = @(
            "/nologo", "/target:winexe", "/platform:anycpu",
            "/out:app/InstaladorUSB.exe",
            "/win32icon:app/Runa-M.ico",
            "/reference:System.dll", "/reference:System.Windows.Forms.dll",
            "app/InstaladorUSB.cs"
          )
          & $csc @usbArgs
          if ($LASTEXITCODE -ne 0) { throw "Compiling InstaladorUSB.exe failed." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Setup.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\JotnarSetup.iss

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path app\* -DestinationPath dist\hardware-diagnostics-tool-portable.zip -Force

      - name: Upload build artifacts (for workflow_dispatch runs without a tag)
        uses: actions/upload-artifact@v4
        with:
          name: hardware-diagnostics-tool-build
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hardware-diagnostics-tool-portable.zip
            dist/JotnarHardwareDiagnostics-Setup.exe
          generate_release_notes: true
