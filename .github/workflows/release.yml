name: Release

# Builds the portable .exe launchers, packages a portable ZIP, and compiles the
# Inno Setup installer (Setup.exe) - then publishes all of it as GitHub Release
# assets. This is what makes "download and run" possible without anyone having to
# compile anything themselves. Runs on windows-latest since it needs csc.exe
# (bundled with .NET Framework on Windows) and Inno Setup.
#
# Trigger a release by pushing a tag: git tag v3.0.0 && git push origin v3.0.0
# Or run it manually from the Actions tab (workflow_dispatch) to sanity-check the
# build without publishing a tagged release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate app icon (Runa-M.ico)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File app/Crear-Icono.ps1

      - name: Compile Diagnostico-Hardware.exe and InstaladorUSB.exe
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          if (-not (Test-Path $csc)) { throw "csc.exe not found on this runner." }

          # Paths built with Join-Path (absolute, native backslashes) instead of
          # hand-written "app/..." forward-slash strings - the older .NET Framework
          # csc.exe treats "/" as a switch delimiter even when it shows up inside an
          # argument's value or the bare source-file argument, which silently ate
          # the "app" folder off every path and broke both previous release builds
          # (CS1504: source file 'Launcher.cs' could not be opened). Plain backslash
          # paths have no "/" characters left for csc.exe to misparse.
          $appDir = Join-Path $PWD.Path "app"

          $launcherArgs = @(
            "/nologo", "/target:winexe", "/platform:anycpu",
            "/out:$(Join-Path $appDir 'Diagnostico-Hardware.exe')",
            "/win32manifest:$(Join-Path $appDir 'app.manifest')",
            "/win32icon:$(Join-Path $appDir 'Runa-M.ico')",
            "/reference:System.dll", "/reference:System.Windows.Forms.dll",
            (Join-Path $appDir "Launcher.cs")
          )
          & $csc @launcherArgs
          if ($LASTEXITCODE -ne 0) { throw "Compiling Diagnostico-Hardware.exe failed." }

          $usbArgs = @(
            "/nologo", "/target:winexe", "/platform:anycpu",
            "/out:$(Join-Path $appDir 'InstaladorUSB.exe')",
            "/win32icon:$(Join-Path $appDir 'Runa-M.ico')",
            "/reference:System.dll", "/reference:System.Windows.Forms.dll",
            (Join-Path $appDir "InstaladorUSB.cs")
          )
          & $csc @usbArgs
          if ($LASTEXITCODE -ne 0) { throw "Compiling InstaladorUSB.exe failed." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Setup.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" (Join-Path $PWD.Path "installer\JotnarSetup.iss")

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path app\* -DestinationPath dist\hardware-diagnostics-tool-portable.zip -Force

      - name: Upload build artifacts (for workflow_dispatch runs without a tag)
        uses: actions/upload-artifact@v4
        with:
          name: hardware-diagnostics-tool-build
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hardware-diagnostics-tool-portable.zip
            dist/JotnarHardwareDiagnostics-Setup.exe
          generate_release_notes: true
