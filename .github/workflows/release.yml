name: Release

# Builds WinDiag on Windows and publishes a GitHub Release with an installer
# (NSIS) and a portable zip. It builds the edition whose code is in this
# repository: Bench in the private one, Home in the public one.
#
# Trigger: bump the version, commit, then push a matching tag:
#   git tag v2.5.0 && git push origin v2.5.0
# Running it by hand (Actions tab) only builds and keeps the files as a
# workflow artifact; it does not publish a release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version."
          }

      - run: npm ci

      - name: Find the edition
        shell: pwsh
        run: |
          if (Test-Path src/renderer/src/bench/edition.js) {
            "EDITION=bench" >> $env:GITHUB_ENV
            "EDITION_NAME=WinDiag Bench" >> $env:GITHUB_ENV
            "EXE_NAME=windiag-bench" >> $env:GITHUB_ENV
            "OUT_DIR=dist" >> $env:GITHUB_ENV
            "ADMIN_NOTE=The app asks for administrator rights when it starts." >> $env:GITHUB_ENV
          } else {
            "EDITION=home" >> $env:GITHUB_ENV
            "EDITION_NAME=WinDiag" >> $env:GITHUB_ENV
            "EXE_NAME=windiag" >> $env:GITHUB_ENV
            "OUT_DIR=dist-home" >> $env:GITHUB_ENV
            "ADMIN_NOTE=It asks for administrator rights only for the actions that need them." >> $env:GITHUB_ENV
          }

      - name: Build installer and portable zip
        run: node scripts/build-win.mjs ${{ env.EDITION }} --x64 --publish never

      - name: Write release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($version)) " | Select-Object -First 1).LineNumber
          $notes = @()
          if ($start) {
            foreach ($line in $lines[$start..($lines.Count - 1)]) {
              if ($line -match '^## ') { break }
              $notes += $line
            }
          }
          $body = @(
            '## Downloads',
            '',
            "- **$env:EXE_NAME-$version-setup.exe**: installer. Adds Start menu and desktop shortcuts.",
            "- **$env:EXE_NAME-$version-portable.zip**: portable. Extract it anywhere (for example a USB drive) and run ``$env:EXE_NAME.exe``.",
            '',
            "Requires Windows 10 or 11, 64-bit. $env:ADMIN_NOTE",
            '',
            "## What's new"
          ) + $notes
          $body -join "`n" | Set-Content -Encoding utf8 release-notes.md

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}-windows
          path: |
            ${{ env.OUT_DIR }}/*-setup.exe
            ${{ env.OUT_DIR }}/*-portable.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.EDITION_NAME }} ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            ${{ env.OUT_DIR }}/*-setup.exe
            ${{ env.OUT_DIR }}/*-portable.zip
