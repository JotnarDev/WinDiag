appId: com.jotnar.windiag.fluent
productName: WinDiag Fluent
directories:
  output: dist
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,HANDOFF.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{jsconfig.json,components.json}'
asarUnpack:
  - resources/**
win:
  executableName: windiag-fluent
  # Several tools need admin rights (Windows Update, disk reliability
  # counters, touch edge gestures, users), so Windows asks via UAC at launch
  requestedExecutionLevel: requireAdministrator
  # Release assets: an installer and a portable zip that runs without installing
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
zip:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
# Chromium UI locales: keep English and Spanish only (~40 MB smaller install)
electronLanguages:
  - en-US
  - es
  - es-419
