# WinDiag (home edition). Shares the Bench config and changes what makes it a
# separate app: its own id, name and folder, so both editions can be installed
# side by side. Build it with: npm run build:win:home
extends: ./electron-builder.yml
appId: com.jotnar.windiag.home
productName: WinDiag
directories:
  output: dist-home
  buildResources: build
win:
  executableName: windiag
  # Home users shouldn't see a UAC prompt just to open the app: actions that
  # need admin rights ask for them when they run
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  artifactName: windiag-${version}-portable.${ext}
nsis:
  artifactName: windiag-${version}-setup.${ext}
  shortcutName: WinDiag
  uninstallDisplayName: WinDiag
  createDesktopShortcut: always
